services:
  # VMS Backend API + Stream Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vms-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - "${VMS_DATA_ROOT:-vms-data}:/app/data"
      - /etc/localtime:/etc/localtime:ro
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - ADMIN_BOOTSTRAP_PASSWORD=${ADMIN_BOOTSTRAP_PASSWORD:?ADMIN_BOOTSTRAP_PASSWORD is required}
      - DB_PATH=/app/data/vms.db
      - RECORDINGS_DIR=/app/data/recordings
      - STREAMS_DIR=/app/data/streams
      - SNAPSHOTS_DIR=/app/data/snapshots
      - THUMBNAILS_DIR=/app/data/thumbnails
      - RETENTION_DAYS=${RETENTION_DAYS:-30}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080}
    networks:
      - vms-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx reverse proxy (serves frontend + proxies API)
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: vms-nginx
    restart: unless-stopped
    ports:
      - "${VMS_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - vms-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  vms-data:
    driver: local

networks:
  vms-network:
    driver: bridge
