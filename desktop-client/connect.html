<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./assets/vms-shield.svg" type="image/svg+xml" />
    <title>VMS Desktop Client Setup</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1e293b, #0f172a 62%);
        color: #e2e8f0;
        font-family: Segoe UI, Arial, sans-serif;
      }
      .card {
        width: min(640px, calc(100vw - 40px));
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0;
        font-size: 24px;
      }
      .title-row {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .logo {
        width: 44px;
        height: 44px;
        flex: 0 0 auto;
      }
      .subtitle {
        margin: 2px 0 0;
        color: #93c5fd;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      p {
        margin: 10px 0;
        color: #94a3b8;
        line-height: 1.5;
      }
      label {
        display: block;
        margin-top: 16px;
        margin-bottom: 8px;
        font-size: 13px;
        color: #cbd5e1;
      }
      input {
        width: 100%;
        background: #020617;
        border: 1px solid #334155;
        border-radius: 10px;
        color: #e2e8f0;
        padding: 12px;
        font-size: 14px;
        box-sizing: border-box;
      }
      .row {
        display: flex;
        gap: 10px;
        margin-top: 14px;
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 11px 14px;
        cursor: pointer;
        font-weight: 600;
      }
      .primary {
        background: #2563eb;
        color: white;
      }
      .secondary {
        background: #334155;
        color: #e2e8f0;
      }
      .status {
        min-height: 20px;
        margin-top: 12px;
        font-size: 13px;
      }
      .error {
        color: #fda4af;
      }
      .ok {
        color: #86efac;
      }
      code {
        background: #0b1220;
        padding: 2px 6px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="title-row">
        <img src="./assets/vms-shield.svg" alt="VMS Shield Logo" class="logo" />
        <div>
          <h1>Connect to VMS Server</h1>
          <p class="subtitle">VMS Desktop Client</p>
        </div>
      </div>
      <p>
        This desktop app connects to your deployed VMS web server. Enter the base URL below.
        Example: <code>http://192.168.1.50:3001</code> or <code>https://vms.company.local</code>
      </p>

      <label for="serverUrl">Server URL</label>
      <input id="serverUrl" type="url" placeholder="http://localhost:3001" autocomplete="off" />

      <label for="configFile">Import Config File (optional)</label>
      <input id="configFile" type="file" accept="application/json,.json" />

      <div class="row">
        <button id="save" class="primary">Save and Connect</button>
        <button id="import" class="secondary">Import Config</button>
        <button id="reset" class="secondary">Use Default</button>
      </div>

      <div id="status" class="status"></div>
    </main>

    <script>
      const statusEl = document.getElementById('status');
      const input = document.getElementById('serverUrl');
      const fileInput = document.getElementById('configFile');

      function setStatus(message, ok = true) {
        statusEl.className = `status ${ok ? 'ok' : 'error'}`;
        statusEl.textContent = message;
      }

      window.vmsDesktop.onInit(({ serverUrl }) => {
        input.value = serverUrl || 'http://localhost:3001';
      });

      window.vmsDesktop.getServerUrl().then((url) => {
        input.value = input.value || url || 'http://localhost:3001';
      });

      document.getElementById('save').addEventListener('click', async () => {
        const result = await window.vmsDesktop.saveServerUrl(input.value.trim());
        if (!result.ok) {
          setStatus(result.error || 'Unable to save server URL.', false);
          return;
        }
        setStatus(`Connecting to ${result.serverUrl} ...`, true);
      });

      document.getElementById('import').addEventListener('click', async () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) {
          setStatus('Select a config file first.', false);
          return;
        }

        try {
          const text = await file.text();
          const parsed = JSON.parse(text);
          const serverUrl = (parsed.serverUrl || '').trim();

          if (!serverUrl) {
            setStatus('Config file is missing serverUrl.', false);
            return;
          }

          input.value = serverUrl;
          const result = await window.vmsDesktop.saveServerUrl(serverUrl);
          if (!result.ok) {
            setStatus(result.error || 'Unable to apply config.', false);
            return;
          }

          setStatus(`Config imported. Connecting to ${result.serverUrl} ...`, true);
        } catch (_error) {
          setStatus('Invalid config file. Expected JSON with a serverUrl field.', false);
        }
      });

      document.getElementById('reset').addEventListener('click', () => {
        input.value = 'http://localhost:3001';
      });
    </script>
  </body>
</html>
